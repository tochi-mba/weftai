name: Release

# On every push to main: if changesets are pending, open or update a "Version packages" pull
# request; when that pull request is merged (versions bumped, no pending changesets), publish
# every changed package to npm and push the version tags.
#
# Requires the repository secret NPM_TOKEN: an npm granular access token with read and write
# access to the weftai packages and "bypass two-factor authentication" enabled.

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - name: Version or publish
        uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: "Version packages"
          pr-title: "Version packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
